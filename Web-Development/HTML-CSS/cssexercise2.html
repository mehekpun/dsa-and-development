<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS EXERCISE</title>

    <style>
      div p:first-child {
        background-color: yellow;
        color: red;
      }
      div p {
        background-color: blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <div>
      <p>
        yellow red
      </p>
      <p>
        blue white
      </p>
      <p>
        blue white
      </p>
    </div>
    <div>
      <p>
        yellow red
      </p>
      <p>
        blue white
      </p>
    </div>
  </body>
</html>
