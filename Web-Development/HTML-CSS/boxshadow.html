<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box shadow</title>
    <style>
        div.box{
            border: 2px solid black;
            padding: 30px;
            box-shadow: 2px 2px 2px 1px black;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>hello bunny</p>
    </div>
</body>
</html>
